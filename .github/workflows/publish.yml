# Builds, checks and publishes the Azure DevOps extension to the Visual Studio Marketplace
# using Marketplace Trusted Publishing (GitHub OIDC). No stored PAT.
#
# Release: bump "version" in extension/package.json and extension/vss-extension.json, commit
# and push main. A push to main whose version has no vX.Y.Z tag yet is a release: this workflow
# publishes it, then creates the tag and the GitHub release. (Cloud sessions can't push tags, so
# the tag is made here.) Pushing a vX.Y.Z tag yourself still works; the main push then finds the
# tag and does nothing.
# Manual run (Actions tab) defaults to a dry run: build and package only.
#
# tfx-cli has no OIDC support, so the job exchanges the GitHub OIDC token itself, the same
# way @vscode/vsce does (out/oidc.js, MIT): POST {marketplace}/_apis/gallery/token with
# "Authorization: FederatedToken <oidc>", then publishes with the returned credential.
name: publish

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and package only, don't publish"
        type: boolean
        default: true

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  # A main push is a release only when its version has no tag yet; tag pushes and manual runs always go ahead.
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      go: ${{ steps.check.outputs.go }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: check
        run: |
          version=$(node -p "require('./extension/vss-extension.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "branch" ] && [ "$GITHUB_EVENT_NAME" = "push" ] && git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version is already tagged: not a release"; echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release on tags
      id-token: write # Marketplace trusted publishing
    defaults:
      run:
        working-directory: extension
    env:
      PUBLISH: ${{ github.event_name == 'push' || inputs.dry_run == false }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history and tags, for the release notes

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Check versions agree
        id: version
        run: |
          pkg=$(node -p "require('./package.json').version")
          man=$(node -p "require('./vss-extension.json').version")
          [ "$pkg" = "$man" ] || { echo "::error::package.json ($pkg) and vss-extension.json ($man) disagree"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$man" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $man"; exit 1
          fi
          echo "version=$man" >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run package

      - name: Check package
        id: vsix
        run: |
          vsix="out/TrueNorthIT.github-repos-${{ steps.version.outputs.version }}.vsix"
          [ -f "$vsix" ] || { echo "::error::$vsix not found"; exit 1; }
          if unzip -l "$vsix" | grep -qi '\.svg$'; then echo "::error::SVG files in package (Marketplace rejects them)"; exit 1; fi
          if grep -rqE '__TN_MOCK__|mockSdk' dist; then echo "::error::Mock code in dist"; exit 1; fi
          if grep -rqE 'ghu_|github_pat_|__TN_LIVE__|__LIVE_TOKEN__|liveGuard' dist; then echo "::error::Live-mode code or a token in dist"; exit 1; fi
          echo "path=extension/$vsix" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix
          path: ${{ steps.vsix.outputs.path }}
          if-no-files-found: error

      - name: Publish to Marketplace (trusted publishing)
        if: env.PUBLISH == 'true'
        env:
          VSIX: ${{ steps.vsix.outputs.path }}
        run: |
          publisher=$(node -p "require('./vss-extension.json').publisher")
          oidc=$(curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=marketplace.visualstudio.com" | jq -r .value)
          echo "::add-mask::$oidc"
          credential=$(curl -sSf -X POST "https://marketplace.visualstudio.com/_apis/gallery/token?api-version=7.2-preview.1" \
            -H "Authorization: FederatedToken $oidc" -H "Content-Type: application/json" -H "Accept: application/json" \
            -d "{\"publisherName\":\"$publisher\"}" | jq -r .credential)
          [ -n "$credential" ] && [ "$credential" != "null" ] || { echo "::error::Marketplace token exchange returned no credential"; exit 1; }
          echo "::add-mask::$credential"
          # A re-run after the upload went through (e.g. 0.44.0: published, then the validation poll timed out) finds the version already there:
          # carry on to the validation check rather than fail, so the tag and release still get made.
          if ! out=$(npx --no-install tfx extension publish --vsix "$GITHUB_WORKSPACE/$VSIX" --auth-type pat --token "$credential" --no-prompt --no-wait-validation 2>&1); then
            echo "$out"
            echo "$out" | grep -qi "version number must increase" || exit 1
            echo "This version is already on the Marketplace: checking its validation"
          else
            echo "$out"
          fi
          # Marketplace validation can outlast tfx's own ~4 min wait (it took ~4.5 min for 0.7.0), so poll for up to 20 min.
          # A poll that gets no answer (the Marketplace timed out) counts as pending; only a real non-pending status fails.
          version=$(node -p "require('./vss-extension.json').version")
          for i in $(seq 1 40); do
            status=$(npx --no-install tfx extension isvalid --publisher "$publisher" --extension-id github-repos --version "$version" \
              --service-url https://marketplace.visualstudio.com/ --auth-type pat --token "$credential" --no-prompt --json 2>/dev/null | jq -r .status 2>/dev/null || true)
            echo "Validation: ${status:-no answer}"
            [ "$status" = "success" ] && exit 0
            [ -z "$status" ] || [ "$status" = "null" ] || [ "$status" = "pending" ] || { echo "::error::Marketplace validation failed ($status)"; exit 1; }
            sleep 30
          done
          echo "::error::Validation still pending after 20 min; check the Marketplace"; exit 1

      - name: GitHub release
        if: github.event_name == 'push'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          VSIX: ${{ steps.vsix.outputs.path }}
          TAG: v${{ needs.gate.outputs.version }}
        run: |
          # On a main push the tag doesn't exist yet: make it locally for the notes' range, and let `gh release create` create it on GitHub at this commit.
          git rev-parse -q --verify "refs/tags/$TAG" >/dev/null || git tag "$TAG" "$GITHUB_SHA"
          bash .github/scripts/release-notes.sh "$TAG" > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" "$VSIX" --repo "$GITHUB_REPOSITORY" --title "$TAG" --target "$GITHUB_SHA" --notes-file "$RUNNER_TEMP/notes.md"
